# BizBill Android: test, build, sign and publish.
#
#  - Every push / pull request touching bizbill/: web tests + lint, Android
#    lint + unit tests, release build (unsigned if signing secrets are absent).
#  - Tag vX.Y (matching bizbill/version.properties) or manual "release" run:
#    signed APK + AAB, SHA-256 checksums, update.json, GitHub Release.
#
# Required repository secrets for releases (never commit these):
#   BIZBILL_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   BIZBILL_KEYSTORE_PASSWORD
#   BIZBILL_KEY_ALIAS
#   BIZBILL_KEY_PASSWORD
# Optional:
#   BIZBILL_CERT_SHA256       expected signing certificate SHA-256 (pins the key)
name: BizBill Android

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['bizbill/**', '.github/workflows/bizbill-android.yml']
  pull_request:
    paths: ['bizbill/**', '.github/workflows/bizbill-android.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release (version from version.properties)'
        type: boolean
        default: false
      mandatory:
        description: 'Mark this release as a mandatory security update'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bizbill-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: bizbill

jobs:
  web:
    name: Web app tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bizbill/package-lock.json
      - run: npm ci
      - run: npm run version:check
      - run: npm run lint
      - run: npm test
      - name: Browser end-to-end tests
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:e2e
          node tests/e2e/smoke.mjs

  android:
    name: Android build
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Validate version (versionCode must increase)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node tools/check-version.mjs --tag "${GITHUB_REF#refs/tags/}"
          else
            node tools/check-version.mjs
          fi

      - name: Validate Gradle project
        working-directory: bizbill/android
        run: ./gradlew --no-daemon help -q

      - name: Lint and unit tests
        working-directory: bizbill/android
        run: ./gradlew --no-daemon lintRelease testReleaseUnitTest

      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.BIZBILL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BIZBILL_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Signing secrets not configured: building an UNSIGNED release for verification only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK and AAB
        working-directory: bizbill/android
        env:
          BIZBILL_KEYSTORE_PASSWORD: ${{ secrets.BIZBILL_KEYSTORE_PASSWORD }}
          BIZBILL_KEY_ALIAS: ${{ secrets.BIZBILL_KEY_ALIAS }}
          BIZBILL_KEY_PASSWORD: ${{ secrets.BIZBILL_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify signature and collect artifacts
        env:
          EXPECTED_CERT: ${{ secrets.BIZBILL_CERT_SHA256 }}
          MANDATORY_UPDATE: ${{ inputs.mandatory && 'true' || 'false' }}
        run: |
          mkdir -p dist
          APK_DIR=android/app/build/outputs/apk/release
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            cp "$APK_DIR/app-release.apk" dist/BizBill-release.apk
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/apksigner" verify --verbose --print-certs dist/BizBill-release.apk | tee dist/signature.txt
            CERT=$(grep -m1 'certificate SHA-256 digest' dist/signature.txt | awk '{print $NF}')
            if [ -n "$EXPECTED_CERT" ] && [ "${CERT,,}" != "${EXPECTED_CERT,,}" ]; then
              echo "::error::Signing certificate changed! Expected $EXPECTED_CERT, got $CERT. Updates would fail to install."
              exit 1
            fi
            rm dist/signature.txt
          else
            cp "$APK_DIR/app-release-unsigned.apk" dist/BizBill-release.apk
          fi
          cp android/app/build/outputs/bundle/release/app-release.aab dist/BizBill-release.aab
          node tools/make-update-json.mjs dist/BizBill-release.apk dist/BizBill-release.aab dist
          # The generated update.json must pass the same rules the app applies.
          node tools/validate-update-json.mjs dist/update.json
          cat dist/checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bizbill-${{ steps.sign.outputs.signed == 'true' && 'signed' || 'unsigned' }}-${{ github.sha }}
          path: |
            bizbill/dist/*
            bizbill/android/app/build/reports/lint-results-release.html
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: android
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require signed build
        if: needs.android.outputs.signed != 'true'
        run: |
          echo "::error::Releases must be signed. Configure the BIZBILL_KEYSTORE_* secrets."
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: bizbill-signed-${{ github.sha }}
          path: out
      - name: Read version
        id: v
        run: echo "name=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: BizBill ${{ steps.v.outputs.name }}
          body_path: out/dist/release-notes.md
          files: |
            out/dist/BizBill-release.apk
            out/dist/BizBill-release.aab
            out/dist/checksums.txt
            out/dist/update.json
            out/dist/release-notes.md
          fail_on_unmatched_files: true
