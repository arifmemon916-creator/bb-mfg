plugins {
    id 'com.android.application'
}

// ---- Version: single source of truth in ../../version.properties -----------
def versionProps = new Properties()
file('../../version.properties').withInputStream { versionProps.load(it) }
def appVersionName = versionProps.getProperty('VERSION_NAME')
def appVersionCode = versionProps.getProperty('VERSION_CODE') as Integer
def appPackage = versionProps.getProperty('PACKAGE_NAME')
if (appPackage != 'tech.bbmfg.bizbill') {
    throw new GradleException('PACKAGE_NAME must stay tech.bbmfg.bizbill (never change the applicationId)')
}

// ---- Release signing from environment (GitHub Actions secrets) -------------
// Nothing secret is stored in the repository. Without these variables the
// release build is produced UNSIGNED (useful for CI checks on pull requests).
def ksPath = System.getenv('BIZBILL_KEYSTORE_PATH')
def hasSigning = ksPath && new File(ksPath).exists() &&
        System.getenv('BIZBILL_KEYSTORE_PASSWORD') && System.getenv('BIZBILL_KEY_ALIAS') && System.getenv('BIZBILL_KEY_PASSWORD')

android {
    namespace 'tech.bbmfg.bizbill'
    compileSdk 35

    defaultConfig {
        applicationId 'tech.bbmfg.bizbill'
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        // Trusted hosts for update.json and the APK (checked again on every redirect).
        buildConfigField 'String', 'UPDATE_HOSTS', '"github.com,objects.githubusercontent.com,release-assets.githubusercontent.com"'
        resourceConfigurations += ['en']
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile file(ksPath)
                storePassword System.getenv('BIZBILL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BIZBILL_KEY_ALIAS')
                keyPassword System.getenv('BIZBILL_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The BizBill web app (../../www) is packaged into the APK assets.
    sourceSets {
        main {
            assets.srcDirs += layout.buildDirectory.dir('generated/webAssets')
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
        // The WebView app intentionally enables JavaScript (all content is local).
        disable 'SetJavaScriptEnabled'
        xmlReport false
        htmlReport true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    dependenciesInfo {
        // Do not embed the dependency metadata blob (not needed outside Play).
        includeInApk = false
        includeInBundle = true
    }
}

def copyWebAssets = tasks.register('copyWebAssets', Copy) {
    description = 'Copies the BizBill web app into the APK assets.'
    from('../../www') {
        exclude 'sw.js', 'manifest.webmanifest'
    }
    into(layout.buildDirectory.dir('generated/webAssets/www'))
}
tasks.named('preBuild') { dependsOn copyWebAssets }

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
